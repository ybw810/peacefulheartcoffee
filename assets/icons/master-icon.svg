<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for Inner Squircle Card -->
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1814" />
      <stop offset="50%" stop-color="#140f0c" />
      <stop offset="100%" stop-color="#0e0b09" />
    </linearGradient>

    <!-- Glowing Amber Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb4" />
      <stop offset="40%" stop-color="#e5b967" />
      <stop offset="80%" stop-color="#d59161" />
      <stop offset="100%" stop-color="#8a4f2b" />
    </linearGradient>

    <!-- Multi-Layer Border Gradient -->
    <linearGradient id="amberRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb4" />
      <stop offset="35%" stop-color="#e5b967" />
      <stop offset="70%" stop-color="#d59161" />
      <stop offset="100%" stop-color="#4a2814" />
    </linearGradient>

    <!-- Cone Glass Gradient -->
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d59161" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8a4f2b" stop-opacity="0.65" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="dropGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Outer Squircle Rim Glow -->
    <filter id="squircleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. FULL-BLEED Canvas Background: Guarantees 0 white edges regardless of OS squircle cut -->
  <rect width="512" height="512" fill="#0e0b09" />

  <!-- 2. LAYER 1: Outer Ambient Halo / Glow Track -->
  <rect x="42" y="42" width="428" height="428" rx="100" ry="100" fill="none" stroke="rgba(229,185,103,0.18)" stroke-width="3" filter="url(#squircleGlow)" />

  <!-- 3. LAYER 2: Raised Artisan Card with Multi-layer Gradient Rim -->
  <rect x="48" y="48" width="416" height="416" rx="94" ry="94" fill="url(#cardBgGrad)" stroke="url(#amberRimGrad)" stroke-width="4.5" />

  <!-- 4. LAYER 3: Inner Glass Highlight Stroke -->
  <rect x="58" y="58" width="396" height="396" rx="84" ry="84" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.8" />
  <rect x="68" y="68" width="376" height="376" rx="74" ry="74" fill="none" stroke="rgba(213,145,97,0.12)" stroke-width="1.2" stroke-dasharray="8 6" />

  <!-- 5. Concentric Dial Gauge Ring & Precision Ticks -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(213,145,97,0.22)" stroke-width="1.5" stroke-dasharray="3 7" />
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="130 520" filter="url(#dropGlow)" />

  <!-- Dial Precision Tick Marks around center -->
  <g stroke="rgba(242,208,142,0.35)" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="102" x2="256" y2="110" />
    <line x1="256" y1="402" x2="256" y2="410" />
    <line x1="102" y1="256" x2="110" y2="256" />
    <line x1="402" y1="256" x2="410" y2="256" />
    <line x1="147" y1="147" x2="153" y2="153" />
    <line x1="365" y1="147" x2="359" y2="153" />
    <line x1="147" y1="365" x2="153" y2="359" />
    <line x1="365" y1="365" x2="359" y2="359" />
  </g>

  <!-- 6. V60 Dripper Top Rim -->
  <line x1="166" y1="198" x2="346" y2="198" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" filter="url(#dropGlow)" />

  <!-- 7. V60 Dripper Cone -->
  <polygon points="182,204 330,204 282,288 230,288" fill="url(#coneGrad)" stroke="#d59161" stroke-width="5.5" stroke-linejoin="round" />
  
  <!-- Spiral Extraction Ribs inside Dripper -->
  <line x1="214" y1="210" x2="243" y2="282" stroke="rgba(242,208,142,0.45)" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="210" x2="256" y2="282" stroke="rgba(242,208,142,0.75)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="298" y1="210" x2="269" y2="282" stroke="rgba(242,208,142,0.45)" stroke-width="3" stroke-linecap="round" />

  <!-- 8. Dripper Base Plate -->
  <line x1="220" y1="294" x2="292" y2="294" stroke="#d59161" stroke-width="8" stroke-linecap="round" />

  <!-- 9. Golden Espresso Drop Falling with Specular Gleam -->
  <path d="M256,320 C256,320 240,342 240,355 C240,363.8 247.2,371 256,371 C264.8,371 272,363.8 272,355 C272,342 256,320 256,320 Z" fill="url(#goldGrad)" filter="url(#dropGlow)" />
  <circle cx="251.5" cy="352" r="3.8" fill="#ffffff" opacity="0.85" />
</svg>
